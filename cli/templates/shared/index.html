<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ludic Canvas game starter</title>
  </head>
  <body>
    <main id="stage" aria-label="Game preview">
      <canvas id="world" aria-hidden="true"></canvas>
      <canvas id="ui" aria-label="Game controls. Tab through the controls, Enter or Space to activate."></canvas>
      <p id="loading" role="status">Preparing your game...</p>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
