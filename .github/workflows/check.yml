name: Check
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      full: ${{ github.event_name != 'pull_request' }}

  # Preserve the second required context without executing the tests twice.
  browser:
    if: ${{ always() }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify the reusable workflow result
        env:
          RESULT: ${{ needs.checks.result }}
          PASSED: ${{ needs.checks.outputs.passed }}
        run: |
          printf 'CI workflow: %s; aggregate passed: %s\n' "$RESULT" "$PASSED" >> "$GITHUB_STEP_SUMMARY"
          test "$RESULT" = success && test "$PASSED" = true
