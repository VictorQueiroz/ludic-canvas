name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    needs: [checks, plan]
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - uses: changesets/action/version@v2.1.2
        with:
          script: npm run version-packages
          pr-title: Release Ludic Canvas
          commit-message: 'chore: version Ludic Canvas'

  publish:
    needs: [checks, plan]
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - uses: changesets/action/publish@v2.1.2
        with:
          script: npm run release
        env:
          NPM_CONFIG_PROVENANCE: 'true'
